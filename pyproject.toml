[project]
name = "oai-pmh-mcp"
version = "0.1.2"
description = "Uniwersalny serwer MCP dla protokołu OAI-PMH — odpytuj dowolne repozytorium (dLibra, DSpace, EPrints, PMC…) przez Model Context Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["mcp", "oai-pmh", "dlibra", "digital-library", "metadata", "harvesting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "lxml>=5.0",
]

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/mpasternak/oai-pmh-mcp"
Repository = "https://github.com/mpasternak/oai-pmh-mcp"

[project.scripts]
oai-pmh-mcp = "oai_pmh_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oai_pmh_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: testy uderzające w prawdziwy endpoint (wymaga sieci; domyślnie pomijane)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
